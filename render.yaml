services:
  - type: web
    name: limen-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: PUBLIC_RATE_LIMIT_STORE
        value: supabase
      - key: FRONTEND_URLS
        value: https://limen-serve.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
